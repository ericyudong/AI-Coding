name: SmartHealth CI

# ─────────────────────────────────────────────────────────────────────────────
# 为什么这份 workflow 在**仓库根**，而不是 SmartHealth/.github/ 下面
#
#   GitHub Actions 只加载仓库根的 .github/workflows/ —— 子目录里的 workflow
#   不会被执行。AI-Coding 是 monorepo，所以 SmartHealth 的流水线必须挂在根上，
#   再用 defaults.run.working-directory 把执行目录钉死在子项目里。
#
#   SmartHealth/.github/workflows/ci.yml 是同一套逻辑的「单库版」，供 SmartHealth
#   被拆成独立仓库时开箱即用。两者都不含检查逻辑本身 —— 检查项全部写在
#   SmartHealth/scripts/ci.sh 里，YAML 只是 `bash scripts/ci.sh <profile>` 的薄壳。
#   这样本地与 CI 完全一致：CI 失败时把最后一行命令抄下来就能复现。
# ─────────────────────────────────────────────────────────────────────────────
#
# 档位与触发点（与 scripts/ci.sh 的三个 profile 一一对应）：
#
#   push / PR（SmartHealth 有改动）  → fast         纯 SQLite，几分钟内出结果
#   SmartHealth-v* tag              → fast + staging + release   上线门禁
#   workflow_dispatch               → 按所选 profile 决定跑哪几档
#
# staging / release 档会拉起真实 PostgreSQL 与 Redis 容器，验证生产形态：
# PG 的 `FOR UPDATE SKIP LOCKED` 任务领取、Redis 分布式锁、多进程 Worker
# 并发、SSE 实时通道 —— 这些在 SQLite 的 fast 档里**测不到**。

on:
  push:
    branches: [main, master, develop]
    # 用 SmartHealth- 前缀限定 tag：monorepo 里其它项目的 tag 不该触发本项目的
    # 上线门禁。另外注意 GitHub 的官方行为 —— **路径过滤对 tag 推送不生效**
    # （path filters are not evaluated for pushes of tags），所以 tag 防线只能
    # 靠前缀来收窄，不能指望下面的 paths。
    tags: ['SmartHealth-v*']
    paths:
      - 'SmartHealth/**'
      - '.github/workflows/smarthealth-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'SmartHealth/**'
      - '.github/workflows/smarthealth-ci.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: '要运行的档位'
        required: true
        default: staging
        type: choice
        options: [fast, staging, release]

concurrency:
  # 同一分支的旧运行自动取消：CI 排队只会浪费算力，快速反馈更重要。
  group: smarthealth-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  # ------------------------------------------------------------------ 快速检查
  fast:
    name: 快速检查（SQLite）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        # monorepo 的关键一行：所有 run 步骤都在 SmartHealth/ 里执行，
        # 于是 `bash scripts/ci.sh fast` 的语义与在单库根目录下完全一致。
        working-directory: SmartHealth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: SmartHealth/requirements.txt

      - name: 运行快速档
        run: bash scripts/ci.sh fast

      - name: 失败时上传步骤日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smarthealth-ci-fast-logs
          # ci.sh 把每一步的完整输出放在临时目录里并把路径打印在汇总里；
          # 这里把整个临时目录收集起来，避免「CI 上失败但看不到细节」。
          # 注意 upload-artifact 的相对路径以 workspace 根为基准，
          # 不受上面 working-directory 影响。
          path: |
            ${{ runner.temp }}/**/*.log
            /tmp/tmp.*/*.log
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------ 生产形态（PG + Redis）
  staging:
    name: 生产形态（PostgreSQL + Redis）
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # 这个 if 不是恒真条件，而是**按所选档位路由**：
    # 手动指定 fast 时没必要花 10 分钟起 PG/Redis 容器。
    if: github.event_name != 'workflow_dispatch' || inputs.profile != 'fast'
    defaults:
      run:
        working-directory: SmartHealth

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smarthealth
          POSTGRES_PASSWORD: smarthealth
          POSTGRES_DB: smarthealth_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarthealth -d smarthealth_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      # ⚠️ 必须用 localhost，不能用服务名 postgres / redis。
      #
      #   GitHub Actions 的服务容器语义取决于 job 跑在哪：
      #     - job **直接跑在 runner 虚拟机**上（本文件的情况，没有写 `container:`）
      #       → 服务容器只是"把端口映射到宿主机"（见上面的 ports: ['5432:5432']），
      #         所以只能通过 localhost:<port> 访问。此时写 `@postgres:5432` 会得到
      #         `failed to resolve host 'postgres': Temporary failure in name resolution`；
      #     - job **自身也在容器里**（写了 `container:`）→ 才可以用服务名当主机名。
      #
      #   这个坑在本机永远复现不出来，而且服务容器的健康检查是通过
      #   `docker inspect` 在容器**内部**做的，早就 Ready 了 —— 日志里一切正常，
      #   只有应用连不上。第一次真正在 GitHub 上跑 staging 档就是死在这里。
      #
      #   顺带对比：GitLab CI 的 job 默认跑在镜像容器里，所以那边用服务别名才对
      #   （见 .gitlab-ci.yml）。两个平台的语义**不同**，不能照抄。
      SMARTHEALTH_DATABASE_URL: postgresql+psycopg://smarthealth:smarthealth@localhost:5432/smarthealth_ci
      SMARTHEALTH_REDIS_URL: redis://localhost:6379/0
      SMARTHEALTH_DEPLOYMENT_ENV: product

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: SmartHealth/requirements.txt

      - name: 运行生产形态档
        run: bash scripts/ci.sh staging

      - name: 失败时上传步骤日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smarthealth-ci-staging-logs
          path: |
            ${{ runner.temp }}/**/*.log
            /tmp/tmp.*/*.log
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------- 上线门禁
  release-gate:
    name: 上线门禁（release）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fast, staging]
    # 这一档是**放行判定**，不该由普通提交触发 —— 否则「门禁通过」会因为跑得
    # 太频繁而失去严肃性。只在打 SmartHealth-v* tag、或手动选 release 时执行。
    if: startsWith(github.ref, 'refs/tags/SmartHealth-v') || (github.event_name == 'workflow_dispatch' && inputs.profile == 'release')
    # environment 是 GitHub 的批准闸门：可在仓库 Settings → Environments 里
    # 给 release 环境配置「必须由指定人员批准」，让门禁与放行权绑定。
    environment:
      name: release
    defaults:
      run:
        working-directory: SmartHealth

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smarthealth
          POSTGRES_PASSWORD: smarthealth
          POSTGRES_DB: smarthealth_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarthealth -d smarthealth_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      # 同 staging：job 直接跑在 runner 上，服务容器只能经 localhost 访问（见 staging 里的详细说明）
      SMARTHEALTH_DATABASE_URL: postgresql+psycopg://smarthealth:smarthealth@localhost:5432/smarthealth_ci
      SMARTHEALTH_REDIS_URL: redis://localhost:6379/0
      SMARTHEALTH_DEPLOYMENT_ENV: product
      # 发布用种子含完整模型产物，让依赖训练/推理结果的用例真正执行
      CI_SEED_MODE: full

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: SmartHealth/requirements.txt

      - name: 运行上线门禁
        run: |
          # 必须开 pipefail：否则管道最后一个命令（tee）的退出码会覆盖 ci.sh 的，
          # 门禁失败也会被判成成功 —— 这是 CI 里最危险的一类错误。
          set -o pipefail
          bash scripts/ci.sh release 2>&1 | tee ci-release.log

      - name: 生成门禁报告
        if: always()
        run: |
          # 把摘要行单独落成一个文件，方便在流水线界面直接看到结论，
          # 不必翻几千行日志去找（也正是为了这个才在脚本里输出稳定摘要行）。
          {
            echo "# SmartHealth 上线门禁报告"
            echo
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 引用：\`${{ github.ref }}\`"
            echo "- 时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```'
            grep -aE 'DOCTOR_SUMMARY|CI_SUMMARY|结论|✗|⊘' ci-release.log 2>/dev/null | tail -40 || true
            echo '```'
          } > ci-gate-report.md
          cat ci-gate-report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smarthealth-release-gate-report
          path: |
            SmartHealth/ci-gate-report.md
            SmartHealth/ci-release.log
          if-no-files-found: warn
          retention-days: 90
