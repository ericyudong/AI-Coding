apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: demo-app-ci
  namespace: tekton-pipelines
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      description: "目标镜像，例如 registry.example.com/demo/demo-app:1.0.1"
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-image
      runAfter: [fetch-source]
      taskRef:
        name: build-push-image
      params:
        - name: image
          value: $(params.image)
        - name: dockerfile
          value: ./Dockerfile
        - name: context
          value: src/app
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: gitops-update
      runAfter: [build-image]
      taskRef:
        name: update-manifest
      params:
        - name: image
          value: $(params.image)
        - name: deployment-file
          value: manifests/deployment.yaml
      workspaces:
        - name: source
          workspace: shared-workspace
