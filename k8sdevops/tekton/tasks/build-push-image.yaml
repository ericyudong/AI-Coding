apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-push-image
  namespace: tekton-pipelines
spec:
  params:
    - name: image
      type: string
      description: "完整镜像地址，例如 registry.example.com/demo/demo-app:1.0.1"
    - name: dockerfile
      type: string
      default: ./Dockerfile
    - name: context
      type: string
      default: .
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      args:
        - --dockerfile=$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image)
        - --cache=true
