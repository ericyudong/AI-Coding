# 本地 / 开发：仅依赖 Presidio + 自定义 Rails，无需 Lakera / Bedrock / LlamaGuard
model_list:
  - model_name: default
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_KEY
      guardrails: [presidio-pii, injection-rail, dialog-rail, tool-rail, output-pii-rail]
  - model_name: reasoning
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_KEY
      guardrails: [presidio-pii, injection-rail, dialog-rail, output-pii-rail]
  - model_name: fast
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: os.environ/OLLAMA_FAST_BASE
      guardrails: [presidio-pii, injection-rail, dialog-rail]
  - model_name: local
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: os.environ/OLLAMA_LOCAL_BASE
      guardrails: [presidio-pii, injection-rail, dialog-rail, tool-rail, output-pii-rail]

router_settings:
  routing_strategy: least-busy
  fallbacks:
    - default: [reasoning]
    - reasoning: [local]
  num_retries: 2
  timeout: 60

guardrails:
  - guardrail_name: presidio-pii
    litellm_params:
      guardrail: presidio
      mode: pre_call
      presidio_analyzer_api_base: os.environ/PRESIDIO_ANALYZER_URL
      presidio_anonymizer_api_base: os.environ/PRESIDIO_ANONYMIZER_URL
      output_parse_pii: true

  - guardrail_name: injection-rail
    litellm_params:
      guardrail: custom_guardrail.InjectionRail
      mode: pre_call
      policy_path: /app/guardrails/policy.yaml

  - guardrail_name: dialog-rail
    litellm_params:
      guardrail: custom_guardrail.DialogRail
      mode: pre_call
      policy_path: /app/guardrails/policy.yaml

  - guardrail_name: tool-rail
    litellm_params:
      guardrail: custom_guardrail.ToolRail
      mode: pre_call
      policy_path: /app/guardrails/policy.yaml

  - guardrail_name: output-pii-rail
    litellm_params:
      guardrail: custom_guardrail.OutputPiiRail
      mode: post_call
      policy_path: /app/guardrails/policy.yaml

litellm_settings:
  callbacks: [otel, custom_callbacks.audit_callback, custom_callbacks.tier_routing_callback]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
