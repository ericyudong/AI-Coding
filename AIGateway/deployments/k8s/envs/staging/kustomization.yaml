apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: registry.internal.example.com/ai/ai-gateway
    newTag: staging

patches:
  - target:
      kind: Deployment
      name: ai-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
