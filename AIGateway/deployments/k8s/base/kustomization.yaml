apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-gateway

resources:
  - deployment.yaml

configMapGenerator:
  - name: guardrail-policy
    files:
      - policy.yaml=../../../guardrails/policy.yaml
    options:
      disableNameSuffixHash: true
  - name: litellm-config
    files:
      - config.yaml=../../../config/config.yaml
    options:
      disableNameSuffixHash: true

images:
  - name: registry.internal.example.com/ai/ai-gateway
    newTag: latest

commonLabels:
  app.kubernetes.io/name: ai-gateway
  app.kubernetes.io/part-of: ai-guardrails
