# 部署用 Secret 请用 External Secrets / SealedSecrets，此处仅为清单占位
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secrets
  namespace: ai-gateway
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "replace-me"
  OPENAI_KEY: "replace-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-gateway
  labels:
    app: ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
        - name: litellm
          image: registry.internal.example.com/ai/ai-gateway:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: LITELLM_MASTER_KEY
            - name: OPENAI_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: OPENAI_KEY
                  optional: true
            - name: PRESIDIO_ANALYZER_URL
              value: http://presidio-analyzer.ai-gateway.svc:5001
            - name: PRESIDIO_ANONYMIZER_URL
              value: http://presidio-anonymizer.ai-gateway.svc:5002
            - name: GUARDRAIL_POLICY_PATH
              value: /app/guardrails/policy.yaml
            - name: AUDIT_LOG_PATH
              value: /var/log/ai-gateway/audit.jsonl
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc:4317
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: policy
              mountPath: /app/guardrails
              readOnly: true
            - name: audit
              mountPath: /var/log/ai-gateway
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: policy
          configMap:
            name: guardrail-policy
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: ai-gateway
  labels:
    app: ai-gateway
spec:
  selector:
    app: ai-gateway
  ports:
    - name: http
      port: 4000
      targetPort: http
