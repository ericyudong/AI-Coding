apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ai-gateway
  namespace: ai-gateway
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
        - name: litellm
          image: registry.internal.example.com/ai/ai-gateway:__IMAGE_TAG__
          ports:
            - containerPort: 4000
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: guardrail-slo
        - setWeight: 50
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: guardrail-slo
        - setWeight: 100
