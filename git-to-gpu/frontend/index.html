<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git → GPU · AI Factory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0: #0b0f14;
            --bg1: #121820;
            --line: rgba(255,255,255,0.08);
            --text: #e8eef5;
            --muted: #8b97a8;
            --git: #F05032;
            --ci: #326CE5;
            --kf: #3b82f6;
            --reg: #8b5cf6;
            --ks: #ec4899;
            --rt: #a78bfa;
            --gpu: #76B900;
            --ok: #34d399;
            --warn: #fbbf24;
            --fail: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            color: var(--text);
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(50,108,229,0.18), transparent 55%),
                radial-gradient(900px 500px at 90% 0%, rgba(118,185,0,0.12), transparent 50%),
                linear-gradient(180deg, var(--bg0), #0e141c 40%, var(--bg0));
            min-height: 100vh;
        }
        .shell { max-width: 1280px; margin: 0 auto; padding: 28px 20px 64px; }
        .hero {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 28px;
            align-items: end;
            margin-bottom: 28px;
        }
        @media (max-width: 960px) { .hero { grid-template-columns: 1fr; } }
        .brand {
            font-family: Syne, sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 4vw, 3.2rem);
            line-height: 0.95;
            letter-spacing: -0.03em;
        }
        .brand span { color: var(--gpu); }
        .tagline { color: var(--muted); margin-top: 14px; max-width: 42rem; font-size: 13px; line-height: 1.65; }
        .flow-chip {
            display: inline-flex; flex-wrap: wrap; gap: 6px; margin-top: 18px;
            font-size: 11px; color: #c9d4e3;
        }
        .flow-chip b {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--line);
            padding: 4px 8px; border-radius: 6px; font-weight: 500;
        }
        .hero-art {
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            background: #0a0d12;
            max-height: 320px;
        }
        .hero-art img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; opacity: 0.92; }
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }
        @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        .stat {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
        }
        .stat b { display: block; font-family: Syne, sans-serif; font-size: 1.55rem; color: var(--gpu); }
        .stat span { color: var(--muted); font-size: 11px; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .tab {
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.03);
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
        }
        .tab.active { color: #0b0f14; background: var(--gpu); border-color: var(--gpu); font-weight: 600; }
        .panel { display: none; }
        .panel.active { display: block; }
        .grid { display: grid; gap: 14px; }
        .g2 { grid-template-columns: 1.1fr 0.9fr; }
        .g3 { grid-template-columns: repeat(3, 1fr); }
        @media (max-width: 960px) { .g2, .g3 { grid-template-columns: 1fr; } }
        .card {
            background: rgba(18,24,32,0.85);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
        }
        .card h3 {
            font-family: Syne, sans-serif;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h3::before {
            content: "";
            width: 4px; height: 14px;
            border-radius: 2px;
            background: var(--gpu);
        }
        .muted { color: var(--muted); font-size: 12px; line-height: 1.55; }
        .mono { font-family: inherit; }
        button, .btn {
            font: inherit;
            font-size: 12px;
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;
            color: #0b0f14;
            background: var(--gpu);
            font-weight: 600;
        }
        button.ghost, .ghost {
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid var(--line);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
        input, select, textarea {
            width: 100%;
            background: rgba(0,0,0,0.28);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
            font-size: 12px;
        }
        textarea { min-height: 72px; resize: vertical; }
        select option { background: #121820; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { color: var(--muted); font-weight: 500; }
        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 600;
        }
        .p-ok { background: rgba(52,211,153,0.15); color: var(--ok); }
        .p-run { background: rgba(50,108,229,0.18); color: #93c5fd; }
        .p-pend { background: rgba(251,191,36,0.15); color: var(--warn); }
        .p-fail { background: rgba(248,113,113,0.15); color: var(--fail); }
        .pipeline {
            display: flex;
            flex-direction: column;
            gap: 0;
            position: relative;
        }
        .layer {
            position: relative;
            padding: 14px 14px 14px 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            margin-bottom: 10px;
        }
        .layer .name {
            font-family: Syne, sans-serif;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .layer .role { color: var(--muted); font-size: 11px; margin-top: 2px; }
        .layer .bits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .bit {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--line);
            color: #c5d0de;
        }
        .arrow {
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            margin: -4px 0 6px;
            letter-spacing: 0.2em;
        }
        .principle {
            border: 1px solid rgba(118,185,0,0.35);
            background:
                linear-gradient(135deg, rgba(118,185,0,0.12), transparent 55%),
                rgba(18,24,32,0.9);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
        }
        .principle h2 {
            font-family: Syne, sans-serif;
            font-size: 1.15rem;
            line-height: 1.35;
            margin-bottom: 10px;
        }
        .principle ul { margin-left: 1.1rem; color: #c9d4e3; font-size: 12px; line-height: 1.7; }
        .logs {
            background: #070a0e;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            max-height: 280px;
            overflow: auto;
            font-size: 11px;
            line-height: 1.55;
            color: #a8b6c8;
        }
        .logs div { margin-bottom: 4px; }
        .stage-bar { display: grid; gap: 6px; margin-top: 10px; }
        .stage-row {
            display: grid;
            grid-template-columns: 120px 72px 1fr;
            gap: 8px;
            align-items: center;
            font-size: 11px;
        }
        .toast {
            position: fixed; right: 18px; bottom: 18px;
            display: none; max-width: 360px;
            background: #152032; border: 1px solid var(--line);
            padding: 12px 14px; border-radius: 10px; font-size: 12px; z-index: 20;
        }
        .cuda {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
        }
        .cuda span {
            border: 1px dashed rgba(118,185,0,0.4);
            color: var(--gpu);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
        }
    </style>
</head>
<body>
<div class="shell">
    <header class="hero">
        <div>
            <div class="brand">Git → <span>GPU</span><br>AI Factory</div>
            <p class="tagline">
                From Git Commit to NVIDIA GPU — 生产级 AI/ML 平台的真实路径。
                训练只是旅程的一部分；关键工程挑战是把模型开发变成可重复、可扩展、可迁移的生产推理路径。
            </p>
            <div class="flow-chip" id="flowChip"></div>
        </div>
        <div class="hero-art">
            <img src="/architecture.png" alt="From Git Commit to NVIDIA GPU architecture">
        </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="tabs">
        <button type="button" class="tab active" data-p="factory" onclick="showPage('factory')">架构流水线</button>
        <button type="button" class="tab" data-p="run" onclick="showPage('run')">跑通一次</button>
        <button type="button" class="tab" data-p="registry" onclick="showPage('registry')">Model Registry</button>
        <button type="button" class="tab" data-p="serve" onclick="showPage('serve')">KServe 推理</button>
    </div>

    <section id="factory" class="panel active"></section>
    <section id="run" class="panel"></section>
    <section id="registry" class="panel"></section>
    <section id="serve" class="panel"></section>
</div>
<div class="toast" id="toast"></div>

<script>
    let data = { layers: [], principle: {}, artifacts: [], services: [], runs: [], stats: {} };
    let currentPage = "factory";
    let activeRunId = null;
    let pollTimer = null;

    function toast(msg, err) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.borderColor = err ? "rgba(248,113,113,.5)" : "rgba(118,185,0,.45)";
        el.style.display = "block";
        setTimeout(() => el.style.display = "none", 2800);
    }
    async function api(path, options) {
        const res = await fetch(path, options);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail || body));
        return body;
    }
    function showPage(name) {
        currentPage = name;
        document.querySelectorAll(".panel").forEach((el) => el.classList.toggle("active", el.id === name));
        document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("active", el.dataset.p === name));
        render();
    }
    function pill(status) {
        const map = {
            Ready: "p-ok", succeeded: "p-ok", done: "p-ok", registered: "p-ok",
            running: "p-run", pending: "p-pend", failed: "p-fail",
        };
        return `<span class="pill ${map[status] || "p-pend"}">${status}</span>`;
    }
    function layerColor(id) {
        return ({ git: "var(--git)", cicd: "var(--ci)", kubeflow: "var(--kf)", registry: "var(--reg)",
            kserve: "var(--ks)", runtime: "var(--rt)", gpu: "var(--gpu)" })[id] || "var(--gpu)";
    }

    function renderStats() {
        const s = data.stats || {};
        document.getElementById("stats").innerHTML = `
            <div class="stat"><b>${s.commits || 0}</b><span>Git commits</span></div>
            <div class="stat"><b>${s.pipeline_runs || 0}</b><span>Kubeflow runs</span></div>
            <div class="stat"><b>${s.artifacts || 0}</b><span>Model artifacts</span></div>
            <div class="stat"><b>${s.services || 0}</b><span>InferenceServices</span></div>
            <div class="stat"><b>${s.inferences || 0}</b><span>Inference calls</span></div>`;
        document.getElementById("flowChip").innerHTML = (data.flow || "")
            .split("→").map((x) => `<b>${x.trim()}</b>`).join('<span style="color:#556">→</span>');
    }

    function renderFactory() {
        const layers = data.layers || [];
        const principle = data.principle || {};
        const htmlLayers = layers.map((layer, idx) => {
            const bits = (layer.contributes || layer.cuda_stack || (layer.runtimes || []).map((r) => r.name)
                || (layer.gpus || []).map((g) => g.name) || []).map((b) => `<span class="bit">${b}</span>`).join("");
            const extra = layer.branches ? `
                <div class="grid g2" style="margin-top:10px">
                    <div class="muted"><strong style="color:#34d399">Training</strong><br>${layer.branches.training.join(" → ")}</div>
                    <div class="muted"><strong style="color:#fbbf24">Evaluation</strong><br>${layer.branches.evaluation.join(" → ")}</div>
                </div>` : "";
            const storage = (layer.storage || []).map((s) => `<span class="bit">${s.name} · ${s.kind}</span>`).join("");
            const runtimes = (layer.runtimes || []).map((r) =>
                `<span class="bit">${r.name}: ${r.engine} · ${r.tagline}</span>`).join("");
            const gpus = (layer.gpus || []).map((g) =>
                `<span class="bit" style="border-color:${g.color}55;color:${g.color}">${g.name} · ${g.memory}</span>`).join("");
            const cuda = (layer.cuda_stack || []).length
                ? `<div class="cuda">${layer.cuda_stack.map((c,i)=>`<span>${c}${i<layer.cuda_stack.length-1?" →":""}</span>`).join("")}</div>` : "";
            return `${idx ? '<div class="arrow">↓</div>' : ""}
                <div class="layer" style="border-left:3px solid ${layerColor(layer.id)}">
                    <div class="name"><span>${layer.name}</span><span class="muted">${layer.role}</span></div>
                    <div class="role">${layer.summary}</div>
                    <div class="bits">${bits}${storage}${runtimes}${gpus}</div>
                    ${extra}${cuda}
                </div>`;
        }).join("");

        document.getElementById("factory").innerHTML = `
            <div class="principle">
                <h2>${principle.title || ""}</h2>
                <p class="muted" style="margin-bottom:10px">Enterprise AI Factory 的底座：可复现流水线 + 模型治理 + 可移植制品 + K8s 原生服务 + GPU 感知基础设施。</p>
                <div class="grid g2">
                    <div>
                        <div class="muted" style="margin-bottom:6px">这使得你可以：</div>
                        <ul>${(principle.enables || []).map((x) => `<li>${x}</li>`).join("")}</ul>
                    </div>
                    <div>
                        <div class="muted" style="margin-bottom:6px">下一步演进：</div>
                        <div class="bits">${(principle.next || []).map((x) => `<span class="bit">${x}</span>`).join("")}</div>
                        <p class="muted" style="margin-top:12px">AI 基础设施成为一门工程学科——而不只是一组 ML 工具的集合。</p>
                    </div>
                </div>
            </div>
            <div class="grid g2">
                <div class="card"><h3>垂直架构（对齐参考图）</h3><div class="pipeline">${htmlLayers}</div></div>
                <div class="card">
                    <h3>各层贡献</h3>
                    ${(data.layers || []).map((l) => `
                        <div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)">
                            <div style="color:${layerColor(l.id)};font-family:Syne,sans-serif;font-weight:700">${l.name}</div>
                            <div class="muted">${l.summary}</div>
                        </div>`).join("")}
                </div>
            </div>`;
    }

    function renderRun() {
        const run = (data.runs || []).find((r) => r.id === activeRunId) || (data.runs || [])[0];
        const stages = run ? Object.entries(run.stages || {}) : [];
        document.getElementById("run").innerHTML = `
            <div class="grid g2">
                <div class="card">
                    <h3>启动端到端流水线</h3>
                    <p class="muted" style="margin-bottom:12px">模拟：Git 提交 → CI/CD → Kubeflow 训练/评估 → Registry 注册制品 → KServe 部署 → Runtime → NVIDIA GPU。</p>
                    <div class="form-row">
                        <div><label>模型名</label><input id="rName" value="assist-llm"></div>
                        <div>
                            <label>推理运行时</label>
                            <select id="rRuntime">
                                <option value="vllm">vLLM · LLM</option>
                                <option value="triton">Triton · Multi-Framework</option>
                                <option value="xgboost">XGBoost · Classical ML</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <label>GPU 代际</label>
                            <select id="rGpu">
                                <option value="h100">H100 · 80GB HBM3</option>
                                <option value="a100">A100 · 40/80GB HBM2</option>
                                <option value="h200">H200 · 141GB HBM3e</option>
                            </select>
                        </div>
                        <div>
                            <label>制品存储</label>
                            <select id="rStorage">
                                <option value="oci">OCI Registry</option>
                                <option value="s3">S3 / MinIO</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <button type="button" onclick="startRun()">Run pipeline</button>
                        <button type="button" class="ghost" onclick="refresh()">刷新</button>
                    </div>
                </div>
                <div class="card">
                    <h3>当前运行 ${run ? pill(run.status) : ""}</h3>
                    ${run ? `
                        <div class="muted" style="margin-bottom:8px">${run.name} · commit ${run.commit} · ${run.runtime} @ ${run.gpu}</div>
                        <div class="stage-bar">
                            ${stages.map(([k,v]) => `
                                <div class="stage-row">
                                    <span class="mono">${k}</span>${pill(v.status)}
                                    <span class="muted">${v.message || ""}</span>
                                </div>`).join("")}
                        </div>
                        <div class="logs" style="margin-top:12px">
                            ${(run.logs || []).map((l) => `<div>${l.msg}</div>`).join("") || "等待日志…"}
                        </div>
                    ` : '<p class="muted">还没有运行。点击左侧启动一次完整路径。</p>'}
                </div>
            </div>`;
        if (run && run.runtime === "xgboost") {
            const sel = document.getElementById("rRuntime");
            if (sel) sel.value = "xgboost";
        }
    }

    function renderRegistry() {
        const rows = (data.artifacts || []).map((a) => `
            <tr>
                <td><strong>${a.name}</strong><div class="muted mono">${a.version}</div></td>
                <td>${a.framework}</td>
                <td><span class="pill p-run">${a.storage.toUpperCase()}</span></td>
                <td class="mono muted" style="font-size:11px">${a.uri}</td>
                <td>${a.preferred_runtime}${a.preferred_gpu ? " / " + a.preferred_gpu : ""}</td>
                <td>
                    <div class="row">
                        <button type="button" class="ghost" style="padding:6px 8px" onclick="migrate('${a.id}','${a.storage === "s3" ? "oci" : "s3"}')">迁到 ${a.storage === "s3" ? "OCI" : "S3"}</button>
                        <button type="button" style="padding:6px 8px" onclick="redeploy('${a.id}','${a.preferred_runtime}','${a.preferred_gpu || "a100"}')">KServe 部署</button>
                    </div>
                </td>
            </tr>`).join("");
        document.getElementById("registry").innerHTML = `
            <div class="card" style="margin-bottom:14px">
                <h3>核心原则</h3>
                <p class="muted">不要把模型当成容器。把模型当成<strong style="color:var(--text)">版本化制品</strong>。
                训练集群、对象存储 / OCI、KServe 运行时、GPU 代际彼此解耦，才能跨环境迁移与按需换引擎。</p>
            </div>
            <div class="card">
                <h3>注册表中的模型制品</h3>
                <table>
                    <thead><tr><th>模型</th><th>框架</th><th>存储</th><th>URI</th><th>Runtime / GPU</th><th></th></tr></thead>
                    <tbody>${rows || '<tr><td colspan="6" class="muted">暂无制品</td></tr>'}</tbody>
                </table>
            </div>`;
    }

    function renderServe() {
        const cards = (data.services || []).map((s) => `
            <div class="card">
                <div class="row" style="justify-content:space-between;margin-bottom:8px">
                    <strong>${s.name}</strong>${pill(s.status)}
                </div>
                <div class="muted" style="margin-bottom:8px">${s.artifact_name} ${s.artifact_version} · ${s.runtime}${s.gpu ? " @ " + s.gpu : ""}</div>
                <div class="mono muted" style="font-size:11px;margin-bottom:10px">${s.endpoint}</div>
                <div class="mono muted" style="font-size:11px;margin-bottom:12px">artifact: ${s.artifact_uri}</div>
                <button type="button" onclick="doInfer('${s.id}')">试一次推理</button>
                <div class="logs" id="out-${s.id}" style="margin-top:10px;max-height:120px;display:none"></div>
            </div>`).join("");
        document.getElementById("serve").innerHTML = `
            <div class="card" style="margin-bottom:14px">
                <h3>KServe + Inference Runtime</h3>
                <p class="muted">InferenceService 引用 Registry 中的制品 URI，再绑定 XGBoost / Triton / vLLM。
                换运行时或 GPU 代际时，不必把模型重新烤进容器。</p>
            </div>
            <div class="grid g3">${cards || '<div class="card muted">暂无 InferenceService</div>'}</div>
            <div class="card" style="margin-top:14px">
                <label>推理输入（用于下方按钮）</label>
                <textarea id="prompt">比较一下把模型当容器 vs 当版本化制品的差别</textarea>
            </div>`;
    }

    function render() {
        renderStats();
        if (currentPage === "factory") renderFactory();
        if (currentPage === "run") renderRun();
        if (currentPage === "registry") renderRegistry();
        if (currentPage === "serve") renderServe();
    }

    async function refresh() {
        data = await api("/api/overview");
        if (activeRunId) {
            try {
                const run = await api("/api/runs/" + activeRunId);
                const idx = (data.runs || []).findIndex((r) => r.id === activeRunId);
                if (idx >= 0) data.runs[idx] = run;
                else data.runs = [run, ...(data.runs || [])];
                if (run.status === "running") schedulePoll();
                else clearInterval(pollTimer);
            } catch (_) {}
        }
        render();
    }
    function schedulePoll() {
        clearInterval(pollTimer);
        pollTimer = setInterval(refresh, 700);
    }
    async function startRun() {
        try {
            const body = {
                name: document.getElementById("rName").value,
                runtime: document.getElementById("rRuntime").value,
                gpu: document.getElementById("rGpu").value,
                storage: document.getElementById("rStorage").value,
                framework: document.getElementById("rRuntime").value === "xgboost" ? "xgboost" :
                    (document.getElementById("rRuntime").value === "triton" ? "pytorch" : "transformers"),
            };
            const run = await api("/api/runs", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            activeRunId = run.id;
            toast("流水线已启动");
            schedulePoll();
            await refresh();
        } catch (err) { toast(err.message, true); }
    }
    async function migrate(id, target) {
        try {
            await api(`/api/artifacts/${id}/migrate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ target_storage: target }),
            });
            toast("制品已迁移到 " + target.toUpperCase());
            await refresh();
        } catch (err) { toast(err.message, true); }
    }
    async function redeploy(id, runtime, gpu) {
        try {
            await api(`/api/artifacts/${id}/deploy`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ artifact_id: id, runtime, gpu: runtime === "xgboost" ? null : gpu }),
            });
            toast("已创建 InferenceService");
            showPage("serve");
            await refresh();
        } catch (err) { toast(err.message, true); }
    }
    async function doInfer(id) {
        try {
            const prompt = (document.getElementById("prompt") || {}).value || "hello";
            const res = await api(`/api/services/${id}/infer`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt }),
            });
            const box = document.getElementById("out-" + id);
            box.style.display = "block";
            box.innerHTML = `<div>${res.output}</div><div class="muted" style="margin-top:6px">${res.latency_ms} ms · ${res.principle}</div>`;
            await refresh();
        } catch (err) { toast(err.message, true); }
    }

    refresh();
</script>
</body>
</html>
