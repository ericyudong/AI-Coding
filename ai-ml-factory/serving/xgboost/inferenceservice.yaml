# KServe InferenceService — classical ML via MLServer / sklearn protocol.
# storageUri points at a VERSIONED ARTIFACT, not a baked model image.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-xgb
  namespace: kserve-demo
  labels:
    ai-factory.model: fraud-xgb
    ai-factory.runtime: xgboost
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    model:
      modelFormat:
        name: xgboost
      storageUri: s3://ai-factory/models/fraud-xgb/v1.0.0/
      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
    minReplicas: 1
    maxReplicas: 5
---
apiVersion: v1
kind: Secret
metadata:
  name: fraud-xgb-s3
  namespace: kserve-demo
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio123
  S3_ENDPOINT: http://minio.ml-registry.svc.cluster.local:9000
  S3_USE_HTTPS: "0"
  AWS_REGION: us-east-1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-s3-sa
  namespace: kserve-demo
  annotations:
    serving.kserve.io/s3-endpoint: minio.ml-registry.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
secrets:
  - name: fraud-xgb-s3
