# vLLM LLM InferenceService — model weights loaded from PVC/S3/OCI URI.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: assist-vllm
  namespace: kserve-demo
  labels:
    ai-factory.model: assist-llm
    ai-factory.runtime: vllm
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    prometheus.kserve.io/port: "8080"
    prometheus.kserve.io/path: "/metrics"
spec:
  predictor:
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.5.4
        args:
          - --model
          - /mnt/models
          - --served-model-name
          - assist-llm
          - --dtype
          - auto
          - --max-model-len
          - "8192"
          - --gpu-memory-utilization
          - "0.90"
        env:
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
                optional: true
        ports:
          - containerPort: 8000
            protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: model-volume
            mountPath: /mnt/models
          - name: dshm
            mountPath: /dev/shm
    volumes:
      - name: model-volume
        persistentVolumeClaim:
          claimName: assist-llm-weights
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    minReplicas: 1
    maxReplicas: 3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assist-llm-weights
  namespace: kserve-demo
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi
  # storageClassName: oci-fss   # or CSI driver that syncs from OCI/S3
---
# Optional: OCI-style model sync Job (skopeo / oras) into the PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-assist-llm-oci
  namespace: kserve-demo
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: oras
          image: ghcr.io/oras-project/oras:v1.2.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Pull versioned model artifact from OCI registry into PVC"
              # oras pull registry.example.com/models/assist-llm:v1.0.0 -o /mnt/models
              ls -la /mnt/models || true
          volumeMounts:
            - name: model-volume
              mountPath: /mnt/models
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: assist-llm-weights
