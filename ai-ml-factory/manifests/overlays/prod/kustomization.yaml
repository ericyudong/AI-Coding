apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: InferenceService
      name: assist-vllm
    patch: |-
      - op: replace
        path: /spec/predictor/minReplicas
        value: 2
      - op: replace
        path: /spec/predictor/maxReplicas
        value: 6
      - op: replace
        path: /spec/predictor/nodeSelector/nvidia.com~1gpu.product
        value: NVIDIA-H200
  - target:
      kind: ResourceQuota
      name: gpu-team-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.nvidia.com~1gpu
        value: "16"
      - op: replace
        path: /spec/hard/limits.nvidia.com~1gpu
        value: "16"
