apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: InferenceService
      name: assist-vllm
    patch: |-
      - op: replace
        path: /spec/predictor/minReplicas
        value: 0
      - op: replace
        path: /spec/predictor/nodeSelector/nvidia.com~1gpu.product
        value: NVIDIA-A100-SXM4-40GB
