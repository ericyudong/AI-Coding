# MLflow tracking + model registry backed by MinIO/S3.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: ml-registry
data:
  MLFLOW_S3_ENDPOINT_URL: "http://minio.ml-registry.svc.cluster.local:9000"
  AWS_DEFAULT_REGION: "us-east-1"
  BACKEND_STORE_URI: "sqlite:///mlflow/mlflow.db"
  DEFAULT_ARTIFACT_ROOT: "s3://ai-factory/mlflow"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: ml-registry
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-registry
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.3
          command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:///mlflow/mlflow.db
            - --default-artifact-root
            - s3://ai-factory/mlflow
          envFrom:
            - configMapRef:
                name: mlflow-config
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /mlflow
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-registry
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
