name: CI - Guardrail Gates

on:
  push:
    branches: [main]
    paths:
      - "app-source/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app-source/**"
      - ".github/workflows/ci.yml"

env:
  REGISTRY: registry.internal.example.com/ai
  IMAGE_NAME: ai-guardrails

jobs:
  guardrail-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app-source/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint & policy validation
        run: |
          python scripts/validate_policy.py guardrails/policy.yaml
          python scripts/lint_prompts.py --dir prompts/

      - name: Guardrail policy unit tests
        run: pytest tests/guardrails/ -q --junitxml=reports/policy-tests.xml

      - name: Offline evaluation gate
        run: |
          python scripts/eval.py \
            --policy guardrails/policy.yaml \
            --dataset eval/regression.jsonl \
            --out reports/eval.json
          python scripts/check_gate.py \
            --report reports/eval.json \
            --max-bypass 2 \
            --max-fp 2

      - name: Red team / adversarial
        run: |
          python scripts/redteam.py \
            --policy guardrails/policy.yaml \
            --out reports/redteam.json
          python scripts/check_redteam.py --report reports/redteam.json

      - name: Build image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::8} .

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-reports
          path: app-source/reports/

  promote-manifest:
    needs: guardrail-gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize

      - name: Promote image tags in gitops-env (monorepo)
        env:
          TAG: ${{ github.sha }}
        run: |
          SHORT="${TAG:0:8}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          for ENV in staging prod; do
            pushd "gitops-env/envs/${ENV}" >/dev/null
            kustomize edit set image "${IMAGE}=${IMAGE}:${SHORT}"
            popd >/dev/null
          done
          git config user.name "ai-guardrails-ci"
          git config user.email "ci@example.com"
          git add gitops-env/envs/
          git diff --cached --quiet && echo "No manifest changes" && exit 0
          git commit -m "promote ai-guardrails:${SHORT}"
          git push
          # Split-repo mode: set secrets.GITOPS_PAT + vars.GITOPS_ENV_REPO
          # and checkout the remote gitops-env instead (see app-source/.github).
