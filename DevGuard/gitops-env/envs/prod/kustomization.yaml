apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-guardrails-prod

resources:
  - ../../base

images:
  - name: registry.internal.example.com/ai/ai-guardrails
    newName: registry.internal.example.com/ai/ai-guardrails
    newTag: "changeme"

patches:
  - path: patch-image.yaml
  - target:
      kind: Rollout
      name: ai-guardrails
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
