apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-guardrails-staging

resources:
  - ../../base

images:
  - name: registry.internal.example.com/ai/ai-guardrails
    newName: registry.internal.example.com/ai/ai-guardrails
    newTag: "latest-staging"

patches:
  - path: patch-image.yaml
  - target:
      kind: Rollout
      name: ai-guardrails
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy/canary/steps
        value:
          - setWeight: 50
          - pause: { duration: 2m }
          - setWeight: 100
