# Optional: sync LLM / registry secrets from Vault / cloud SM.
# Requires External Secrets Operator installed in-cluster.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: ai-guardrails-prod
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ai-guardrails"
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-guardrails-llm
  namespace: ai-guardrails-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ai-guardrails-llm
    creationPolicy: Owner
  data:
    - secretKey: EVAL_LLM_KEY
      remoteRef:
        key: ai/guardrails
        property: eval_llm_key
