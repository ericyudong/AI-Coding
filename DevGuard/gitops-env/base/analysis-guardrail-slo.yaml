apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: guardrail-slo
spec:
  # MTTD ≤5min / MTTR ≤15min: Rollout pauses 5m then queries Prometheus.
  # Breach → abort promotion and auto-rollback to stable ReplicaSet.
  metrics:
    - name: false-positive-pct
      interval: 1m
      count: 3
      successCondition: result <= 2
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            100 * sum(rate(guardrail_false_positive_total[5m]))
            / clamp_min(sum(rate(guardrail_requests_total[5m])), 1e-9)
    - name: jailbreak-bypass-pct
      interval: 1m
      count: 3
      successCondition: result <= 2
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            100 * sum(rate(guardrail_jailbreak_bypass_total[5m]))
            / clamp_min(sum(rate(guardrail_requests_total[5m])), 1e-9)
