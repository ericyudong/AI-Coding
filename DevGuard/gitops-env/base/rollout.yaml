apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ai-guardrails
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ai-guardrails
  template:
    metadata:
      labels:
        app: ai-guardrails
    spec:
      containers:
        - name: ai-guardrails
          image: registry.internal.example.com/ai/ai-guardrails:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GUARDRAIL_POLICY_PATH
              value: /etc/guardrails/policy.yaml
          volumeMounts:
            - name: guardrail-policy
              mountPath: /etc/guardrails
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
      volumes:
        - name: guardrail-policy
          configMap:
            name: guardrail-policy
  strategy:
    canary:
      canaryService: ai-guardrails-canary
      stableService: ai-guardrails-stable
      steps:
        - setWeight: 20
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: guardrail-slo
        - setWeight: 50
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: guardrail-slo
        - setWeight: 100
      trafficRouting: {}
