apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-guardrails-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-guardrails
  source:
    repoURL: 'http://10.65.16.39:3000/EHui/claw-agent.git'
    targetRevision: main
    path: gitops-env/envs/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai-guardrails-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /status
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/revisionHistoryLimit
